<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>破荷包備忘 💸</title>
  <!-- 載入 React, ReactDOM, Babel, Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // 讀取/儲存 LocalStorage 資料
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('wallet_memo_items');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: '日版動漫公仔', platform: '淘寶', price: 150, currency: 'RMB', status: 'unpaid', shippingType: 'express', trackingNumber: '', warehouse: '官方集運倉', date: new Date().toISOString().split('T')[0] },
          { id: 2, name: '痛包周邊 badge', platform: '閒魚', price: 45, currency: 'RMB', status: 'shipped', shippingType: 'express', trackingNumber: 'SF12345678', warehouse: '巧巧郎集運', date: new Date().toISOString().split('T')[0] }
        ];
      });

      const [rate, setRate] = useState(() => parseFloat(localStorage.getItem('wallet_memo_rate')) || 4.5);
      const [tab, setTab] = useState('unpaid'); 
      const [banner, setBanner] = useState(() => localStorage.getItem('wallet_memo_banner') || '');
      const [showRateModal, setShowRateModal] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const [formData, setFormData] = useState({
        name: '', platform: '', price: '', isUnknownPrice: false, currency: 'RMB',
        shippingType: 'express', trackingNumber: '', warehouse: '',
        date: new Date().toISOString().split('T')[0]
      });

      useEffect(() => {
        localStorage.setItem('wallet_memo_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('wallet_memo_rate', rate.toString());
      }, [rate]);

      const handleBannerUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setBanner(reader.result);
            localStorage.setItem('wallet_memo_banner', reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveItem = () => {
        if (!formData.name) return;
        let finalStatus = editingItem ? editingItem.status : 'unpaid';
        
        // 填寫單號自動變更狀態為已發貨
        if (formData.shippingType === 'express' && formData.trackingNumber.trim() !== '') {
          if (finalStatus === 'unpaid' || finalStatus === 'unshipped') {
            finalStatus = 'shipped';
          }
        }

        const newItem = {
          id: editingItem ? editingItem.id : Date.now(),
          name: formData.name,
          platform: formData.platform,
          price: formData.isUnknownPrice ? '未知' : (parseFloat(formData.price) || 0),
          currency: formData.currency,
          status: finalStatus,
          shippingType: formData.shippingType,
          trackingNumber: formData.trackingNumber,
          warehouse: formData.warehouse,
          date: formData.date
        };

        if (editingItem) {
          setItems(items.map(i => i.id === editingItem.id ? newItem : i));
        } else {
          setItems([newItem, ...items]);
        }

        setShowAddModal(false);
        setEditingItem(null);
        resetForm();
      };

      const handleDeleteItem = (id) => {
        if (confirm('確定要刪除這個品項嗎？')) {
          setItems(items.filter(i => i.id !== id));
          setShowAddModal(false);
          setEditingItem(null);
        }
      };

      const resetForm = () => {
        setFormData({
          name: '', platform: '', price: '', isUnknownPrice: false, currency: 'RMB',
          shippingType: 'express', trackingNumber: '', warehouse: '',
          date: new Date().toISOString().split('T')[0]
        });
      };

      const openEdit = (item) => {
        setEditingItem(item);
        setFormData({
          name: item.name,
          platform: item.platform || '',
          price: item.price === '未知' ? '' : item.price,
          isUnknownPrice: item.price === '未知',
          currency: item.currency || 'RMB',
          shippingType: item.shippingType || 'express',
          trackingNumber: item.trackingNumber || '',
          warehouse: item.warehouse || '',
          date: item.date || new Date().toISOString().split('T')[0]
        });
        setShowAddModal(true);
      };

      const updateStatus = (id, newStatus) => {
        setItems(items.map(i => i.id === id ? { ...i, status: newStatus } : i));
      };

      const exportToExcel = () => {
        let csv = '\uFEFF物品名稱,購買平台,金額,幣別,狀態,運送方式,單號,集運倉,日期\n';
        items.forEach(i => {
          csv += `"${i.name}","${i.platform || ''}","${i.price}","${i.currency}","${i.status}","${i.shippingType}","${i.trackingNumber}","${i.warehouse}","${i.date}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `破荷包備忘_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      const unpaidItems = items.filter(i => i.status === 'unpaid');
      const paidItems = items.filter(i => i.status === 'shipped' || i.status === 'unshipped');
      const historyItems = items.filter(i => i.status === 'completed');

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white pb-20 shadow-lg relative">
          {/* Banner 區域 (直角滿版) */}
          <div className="relative w-full h-44 bg-gradient-to-r from-pink-400 to-purple-500 overflow-hidden">
            {banner ? (
              <img src={banner} className="w-full h-full object-cover" alt="Banner" />
            ) : (
              <div className="flex flex-col items-center justify-center h-full text-white">
                <h1 className="text-2xl font-extrabold tracking-wider">💸 破荷包備忘</h1>
                <p className="text-xs opacity-80 mt-1">購物與物流管理清單</p>
              </div>
            )}
            <label className="absolute bottom-2 right-2 bg-black/50 text-white text-xs px-2 py-1 rounded cursor-pointer">
              換橫幅
              <input type="file" accept="image/*" onChange={handleBannerUpload} className="hidden" />
            </label>
          </div>

          {/* 頂部按鈕區 */}
          <div className="p-4 flex items-center justify-between border-b bg-gray-50">
            <button onClick={() => setShowRateModal(true)} className="text-xs bg-white border px-3 py-1.5 rounded-full shadow-sm font-medium">
              💱 RMB 匯率: <span className="text-pink-600 font-bold">{rate}</span>
            </button>
            <div className="flex gap-2">
              <button onClick={exportToExcel} className="text-xs bg-green-600 text-white px-3 py-1.5 rounded-full font-medium shadow-sm">
                📥 下載 Excel
              </button>
              <button onClick={() => { resetForm(); setEditingItem(null); setShowAddModal(true); }} className="text-xs bg-pink-500 text-white px-4 py-1.5 rounded-full font-bold shadow-sm">
                + 買買買
              </button>
            </div>
          </div>

          {/* 頁面內容區 */}
          <div className="p-4">
            {/* 未付款 */}
            {tab === 'unpaid' && (
              <div>
                <h2 className="text-sm font-bold text-gray-500 mb-3">🛒 未付款項目 ({unpaidItems.length})</h2>
                {unpaidItems.length === 0 ? (
                  <p className="text-center text-gray-400 py-10 text-sm">目前沒有未付款的願望～</p>
                ) : (
                  <div className="space-y-3">
                    {unpaidItems.map(item => (
                      <div key={item.id} className="p-3 border rounded-xl flex items-center justify-between bg-white shadow-sm">
                        <div onClick={() => openEdit(item)} className="flex-1 cursor-pointer">
                          <div className="font-bold text-gray-800 flex items-center gap-1.5">
                            {item.name}
                            {item.platform && <span className="text-[10px] bg-gray-100 text-gray-600 font-normal px-1.5 py-0.5 rounded border">{item.platform}</span>}
                          </div>
                          <div className="text-xs text-gray-400 mt-1">
                            日期: {item.date} | 金額: <span className="text-pink-600 font-bold">{item.price === '未知' ? '未知待補' : `${item.currency === 'RMB' ? '¥' : '$'}${item.price}`}</span>
                          </div>
                        </div>
                        <button onClick={() => updateStatus(item.id, 'unshipped')} className="text-xs bg-pink-100 text-pink-600 px-3 py-1.5 rounded-lg font-bold">
                          轉已付款
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 已付款 */}
            {tab === 'paid' && (
              <div>
                <h2 className="text-sm font-bold text-gray-500 mb-3">📦 已付款項目 ({paidItems.length})</h2>
                {paidItems.length === 0 ? (
                  <p className="text-center text-gray-400 py-10 text-sm">無已付款商品～</p>
                ) : (
                  <div className="space-y-3">
                    {paidItems.map(item => (
                      <div key={item.id} className="p-3 border rounded-xl bg-white shadow-sm flex items-center justify-between">
                        <div onClick={() => openEdit(item)} className="flex-1 cursor-pointer">
                          <div className="font-bold text-gray-800 flex items-center gap-1.5">
                            {item.name}
                            {item.platform && <span className="text-[10px] bg-gray-100 text-gray-600 font-normal px-1.5 py-0.5 rounded border">{item.platform}</span>}
                          </div>
                          <div className="text-xs text-gray-500 mt-1">
                            {item.shippingType === 'express' ? (
                              <span>單號: <span className="font-medium text-gray-700">{item.trackingNumber || '未填寫'}</span> {item.warehouse && <span className="ml-1 px-1.5 py-0.5 bg-purple-50 text-purple-600 rounded">【{item.warehouse}】</span>}</span>
                            ) : '🤝 面交 / 親提'}
                          </div>
                          <div className="text-xs text-gray-400 mt-0.5">日期: {item.date}</div>
                        </div>
                        <button onClick={() => updateStatus(item.id, 'completed')} className="text-xs bg-purple-600 text-white px-3 py-1.5 rounded-lg font-bold">
                          簽收結案
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 歷史 */}
            {tab === 'history' && (
              <div>
                <h2 className="text-sm font-bold text-gray-500 mb-3">🎉 歷史紀錄 ({historyItems.length})</h2>
                {historyItems.length === 0 ? (
                  <p className="text-center text-gray-400 py-10 text-sm">尚無結案紀錄～</p>
                ) : (
                  <div className="space-y-2">
                    {historyItems.map(item => (
                      <div key={item.id} onClick={() => openEdit(item)} className="p-3 border rounded-xl bg-gray-50 flex justify-between items-center cursor-pointer hover:bg-gray-100">
                        <div>
                          <div className="font-bold text-gray-700 flex items-center gap-1.5">
                            {item.name}
                            {item.platform && <span className="text-[10px] bg-gray-200 text-gray-600 font-normal px-1.5 py-0.5 rounded">{item.platform}</span>}
                          </div>
                          <div className="text-xs text-gray-400 mt-0.5">
                            日期: {item.date} | 金額: {item.price === '未知' ? '未知' : `${item.currency === 'RMB' ? '¥' : '$'}${item.price}`}
                            {item.warehouse && <span className="ml-1 text-purple-600">({item.warehouse})</span>}
                          </div>
                        </div>
                        <span className="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded">明細 / 刪除</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* 底部導覽欄 */}
          <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around py-2.5 z-10">
            <button onClick={() => setTab('unpaid')} className={`text-xs font-bold ${tab === 'unpaid' ? 'text-pink-500' : 'text-gray-400'}`}>
              未付款 ({unpaidItems.length})
            </button>
            <button onClick={() => setTab('paid')} className={`text-xs font-bold ${tab === 'paid' ? 'text-pink-500' : 'text-gray-400'}`}>
              已付款 ({paidItems.length})
            </button>
            <button onClick={() => setTab('history')} className={`text-xs font-bold ${tab === 'history' ? 'text-pink-500' : 'text-gray-400'}`}>
              歷史 ({historyItems.length})
            </button>
          </div>

          {/* 新增 / 編輯 / 明細 Modal */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg">{editingItem ? '品項明細與編輯' : '買買買 💸'}</h3>
                  {editingItem && (
                    <button onClick={() => handleDeleteItem(editingItem.id)} className="text-xs bg-red-50 text-red-500 border border-red-200 px-2.5 py-1 rounded-lg font-bold">
                      🗑️ 刪除品項
                    </button>
                  )}
                </div>

                <div>
                  <label className="text-xs text-gray-500 font-bold">物品名稱</label>
                  <input type="text" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1" placeholder="請輸入商品名稱" />
                </div>
                <div>
                  <label className="text-xs text-gray-500 font-bold">購買平台</label>
                  <input type="text" value={formData.platform} onChange={e => setFormData({ ...formData, platform: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1" placeholder="例如：淘寶 / 閒魚 / 駿河屋" />
                </div>
                <div>
                  <label className="text-xs text-gray-500 font-bold">日期</label>
                  <input type="date" value={formData.date} onChange={e => setFormData({ ...formData, date: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1" />
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className="text-xs text-gray-500 font-bold">金額</label>
                    <input type="number" disabled={formData.isUnknownPrice} value={formData.price} onChange={e => setFormData({ ...formData, price: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1 disabled:bg-gray-100" placeholder="0" />
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 font-bold">幣別</label>
                    <select value={formData.currency} onChange={e => setFormData({ ...formData, currency: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1">
                      <option value="RMB">RMB (¥)</option>
                      <option value="TWD">TWD ($)</option>
                    </select>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <input type="checkbox" id="unk" checked={formData.isUnknownPrice} onChange={e => setFormData({ ...formData, isUnknownPrice: e.target.checked })} />
                  <label htmlFor="unk" className="text-xs text-gray-600">金額未知待補</label>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1 border-t">
                  <div>
                    <label className="text-xs text-gray-500 font-bold">貨運單號 (填入自動切為已發貨)</label>
                    <input type="text" value={formData.trackingNumber} onChange={e => setFormData({ ...formData, trackingNumber: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1" placeholder="快遞單號" />
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 font-bold">集運倉</label>
                    <input type="text" value={formData.warehouse} onChange={e => setFormData({ ...formData, warehouse: e.target.value })} className="w-full border p-2 rounded-lg text-sm mt-1" placeholder="例如：巧巧郎 / 官方" />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowAddModal(false)} className="px-4 py-2 border text-gray-600 text-xs rounded-xl">取消</button>
                  <button onClick={handleSaveItem} className="px-4 py-2 bg-pink-500 text-white text-xs font-bold rounded-xl">儲存變更</button>
                </div>
              </div>
            </div>
          )}

          {/* 匯率 Modal */}
          {showRateModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl text-center space-y-4">
                <h3 className="font-bold">設定 RMB 匯率</h3>
                <input type="number" step="0.01" value={rate} onChange={e => setRate(parseFloat(e.target.value) || 0)} className="w-full border p-2 rounded-lg text-center font-bold text-lg" />
                <button onClick={() => setShowRateModal(false)} className="w-full py-2 bg-pink-500 text-white text-xs font-bold rounded-xl">完成</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
